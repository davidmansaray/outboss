name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, mbstring, bcmath
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          php scripts/setup-demo.php
      - name: Generate typed client routes
        run: php artisan wayfinder:generate --with-form
      - name: Lint, types and deterministic tests
        run: composer ci:check
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Isolated operator journeys
        run: npm run test:browser:user-flows
