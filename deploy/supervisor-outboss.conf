[program:outboss-mail-sync]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 artisan queue:work redis --queue=mail-sync --sleep=1 --tries=3 --max-time=3600
directory=/srv/outboss/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/outboss-mail-sync.log

