        title:
          type: [string, 'null']
        position:
          type: integer
        delay_minutes:
          type: integer
        send_as:
          $ref: '#/components/schemas/SequenceSendAs'
        subject:
          type: [string, 'null']
          description: Subject template (`subject_template` on the model)
        body:
          type: [string, 'null']
          description: Body template (`body_template` on the model)
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'

    SequenceStepEnvelope:
