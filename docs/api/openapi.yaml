  /threads/changes:
    get:
      operationId: listThreadChanges
      tags: [Threads]
      summary: Threads changed since a watermark
      description: |
        Every thread in the workspace changed after `since`, oldest change first, across all
        folders. Call without `since` to get a starting watermark. Keep calling with
        `meta.next_since` while `meta.has_more` is true.

        A caught-up watermark re-reads a 10-second overlap so late commits are never missed;
        drop rows you already hold with the same `updated_at`. Rows with `visible: false` left
        the inbox and should be removed locally. A watermark older than 30 days, or malformed,
        returns `410 sync_reset_required`: reload from the first page.
      x-required-scope: inbox:read
      parameters:
        - name: since
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Changed threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadChanges'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: '`sync_reset_required`'
          content:
