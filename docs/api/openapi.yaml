    AccountPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, code_verifier, redirect_uri, device]
      properties:
        grant_type:
          const: authorization_code
        code:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        redirect_uri:
          type: string
          example: outboss://auth/callback
        device:
          type: object
          required: [install_id, name, platform]
          properties:
            install_id:
              type: string
              maxLength: 64
            name:
              type: string
              maxLength: 120
            platform:
              const: ios
            app_version:
              type: [string, 'null']

    RefreshTokenGrant:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          const: refresh_token
        refresh_token:
          type: string
        workspace_id:
          type: [integer, 'null']
          description: Switch to this workspace. Omit to keep the current one.

    DeviceTokensEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in, workspace_id, device_session_id]
          properties:
            token_type:
              const: Bearer
            access_token:
              type: string
            expires_in:
              type: integer
            refresh_token:
              type: string
            refresh_expires_in:
              type: integer
            workspace_id:
              type: integer
            device_session_id:
              type: string
              format: uuid

    WorkspaceMembershipSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string

    MeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, workspace, workspaces, session, capabilities]
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                email:
                  type: string
                timezone:
                  type: [string, 'null']
            workspace:
              $ref: '#/components/schemas/WorkspaceMembershipSummary'
            workspaces:
              type: array
              items:
                $ref: '#/components/schemas/WorkspaceMembershipSummary'
            session:
              type: object
              properties:
                kind:
                  type: string
                  enum: [device, api_key]
                id:
                  type: [string, 'null']
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  $ref: '#/components/schemas/DateTime'
            capabilities:
              type: object
              properties:
                push:
                  type: boolean

    ServerEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [product, version, api, push, sign_in_url]
          properties:
            product:
              type: string
              enum: [outboss]
            version:
              type: string
              description: Release label, or `dev` when none is configured.
            api:
              type: string
              enum: [v1]
            push:
              type: boolean
              description: Same as `/me` `capabilities.push`.
            sign_in_url:
              type: string
              format: uri
              description: Absolute URL of the web sign-in page to open with the PKCE query.

    RegisterDevicePushRequest:
      type: object
      required: [apns_token, environment, notify]
      properties:
        apns_token:
          type: string
          pattern: '^[0-9a-fA-F]{64,200}$'
        environment:
          type: string
          enum: [production, sandbox]
        notify:
          type: string
          enum: [needs, leads, 'off']

    DevicePushEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            push_available:
              type: boolean
            notify:
              type: string
              enum: [needs, leads, 'off']

    ThreadPerson:
      type: [object, 'null']
      description: The person record linked to the thread, if any.
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name, or the email address when there is no name.
        title:
          type: [string, 'null']
          description: Job title from the person record.

    ThreadAccount:
      type: [object, 'null']
      description: The account (company) linked to the thread, if any.
      properties:
        id:
          type: integer
        name:
          type: string

    ThreadSummary:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: [string, 'null']
        from:
          type: [string, 'null']
        participant_email:
          type: [string, 'null']
        snippet:
          type: [string, 'null']
        mailbox:
          type: [string, 'null']
        mailbox_id:
          type: integer
        participant_name:
          type: [string, 'null']
        unread:
          type: boolean
        has_inbound:
          type: boolean
        classification:
          type: [string, 'null']
        state:
          type: [string, 'null']
        campaign_recipient_id:
          type: [integer, 'null']
        campaign_id:
          type: [integer, 'null']
        campaign_name:
          type: [string, 'null']
        person:
          $ref: '#/components/schemas/ThreadPerson'
        account:
          $ref: '#/components/schemas/ThreadAccount'
        recipient_status:
          type: [string, 'null']
        last_message_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'

    ThreadMessage:
      type: object
      properties:
        id:
          type: integer
        from:
          type: [string, 'null']
          description: Sender name, or the email address when there is no name.
        from_name:
          type: [string, 'null']
        from_email:
          type: [string, 'null']
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        cc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: [string, 'null']
        has_attachments:
          type: boolean
          description: Attachment contents are not stored yet.
        direction:
          $ref: '#/components/schemas/MessageDirection'
        body:
          type: [string, 'null']
        html:
          type: [string, 'null']
        at:
          $ref: '#/components/schemas/DateTime'

    ThreadSummaryPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThreadSummary'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ThreadSummaryCursorPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThreadSummary'
        meta:
          type: object
          required: [per_page, next_cursor]
          properties:
            per_page:
              type: integer
            next_cursor:
              type: [string, 'null']
            prev_cursor:
              type: [string, 'null']

    ThreadSummaryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ThreadSummary'

    ThreadChange:
      type: object
      required: [id, visible]
      description: A full ThreadSummary when `visible` is true; otherwise only `id`, `visible` and `updated_at`.
      allOf:
        - $ref: '#/components/schemas/ThreadSummary'
      properties:
        visible:
          type: boolean

    ThreadChanges:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThreadChange'
        meta:
          type: object
          required: [next_since, has_more]
          properties:
            next_since:
              type: string
            has_more:
              type: boolean

    InboxCountsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [folders, unread, badge]
          properties:
            folders:
              type: object
              additionalProperties:
                type: integer
              description: Keys are the twelve Unibox folders (`needs`, `leads`, `all_replies`, `open`, `ooo`, `delivery`, `opt_outs`, `problems`, `all_open`, `done`, `closed`, `sent`).
            unread:
              type: object
              required: [needs, leads, all_open]
              properties:
                needs:
                  type: integer
                leads:
                  type: integer
                all_open:
                  type: integer
            badge:
              type: integer

    EmailAddress:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: [string, 'null']

    SendAttemptSummary:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string

    ThreadDetail:
      allOf:
        - $ref: '#/components/schemas/ThreadSummary'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ThreadMessage'

    ThreadDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ThreadDetail'

    ThreadReplyResult:
      type: object
      required: [sent, thread_id, send_attempt_id, data]
      properties:
        sent:
          type: boolean
        thread_id:
          type: integer
        send_attempt_id:
          type: integer
        data:
          type: object
          properties:
            thread:
              $ref: '#/components/schemas/ThreadSummary'
            send_attempt:
              $ref: '#/components/schemas/SendAttemptSummary'

    ThreadDoneEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, state]
          properties:
            id:
              type: integer
            state:
              $ref: '#/components/schemas/ThreadLocalState'

    ThreadClassificationResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, action]
          properties:
            id:
              type: integer
            action:
              type: string
        notice:
          type: [string, 'null']

    ComposeMessageResult:
      type: object
      required: [sent, thread_id, message_id, send_attempt_id]
      properties:
        sent:
          type: boolean
        thread_id:
          type: [integer, 'null']
        message_id:
          type: [integer, 'null']
        send_attempt_id:
          type: integer
        data:
          type: object
          properties:
            thread:
              oneOf:
                - $ref: '#/components/schemas/ThreadSummary'
                - type: 'null'
            send_attempt:
              $ref: '#/components/schemas/SendAttemptSummary'

    SentFlag:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean

    MailboxSync:
      type: object
      properties:
        phase:
          type: string
          enum: [idle, queued, syncing, failed]
        percent:
          type: [integer, 'null']
        phase_label:
          type: string
        detail:
          type: string
        button_label:
          type: string
        last_sync_label:
          type: string
        scope_label:
          type: string
        active_scope:
          type: [string, 'null']
          enum: [inbox, sent, null]

    Mailbox:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        sync:
          type: [object, 'null']
          allOf:
            - $ref: '#/components/schemas/MailboxSync'
        error:
          type: [string, 'null']
        effective_reply_identity:
          description: The address replies and new messages are sent from; null while the sender identity needs repair.
          oneOf:
            - type: object
              properties:
                key:
                  type: string
                email:
                  type: string
                name:
                  type: [string, 'null']
            - type: 'null'
        daily_send_cap:
          type: [integer, 'null']
        sending_paused_at:
          $ref: '#/components/schemas/DateTime'
        sending_paused_reason:
          type: [string, 'null']
          enum: [bounce_threshold, provider_error_threshold]
        last_synced_at:
          $ref: '#/components/schemas/DateTime'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'

    MailboxEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Mailbox'

    MailboxPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Mailbox'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    MailboxSyncQueued:
      type: object
      required: [queued, data]
      properties:
        queued:
          type: boolean
        data:
          $ref: '#/components/schemas/Mailbox'

    DomainAuthCheck:
      type: object
      required: [domain, spf, dmarc, dkim]
      properties:
        domain:
          type: string
        spf:
          $ref: '#/components/schemas/DomainAuthResult'
        dmarc:
          $ref: '#/components/schemas/DomainAuthResult'
        dkim:
          $ref: '#/components/schemas/DomainAuthResult'

    SuppressionEntry:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        reason:
          $ref: '#/components/schemas/SuppressionReason'
        created_at:
          $ref: '#/components/schemas/DateTime'

    SuppressionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SuppressionEntry'

    SuppressionPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuppressionEntry'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    EnrollmentExportRecord:
      type: object
      additionalProperties: true
      properties:
        campaign:
          type: [string, 'null']
        campaign_status:
          type: [string, 'null']
        email:
          type: [string, 'null']
        full_name:
          type: [string, 'null']
        first_name:
          type: [string, 'null']
        company:
          type: [string, 'null']
        email_domain:
          type: [string, 'null']
        person_id:
          type: [integer, 'null']
        account_id:
          type: [integer, 'null']
        mailbox:
          type: [string, 'null']
        sequence_version:
          type: [integer, 'null']
        status:
          type: [string, 'null']
        stop_reason:
          type: [string, 'null']
        enrolled_at:
          $ref: '#/components/schemas/DateTime'
        first_sent_at:
          $ref: '#/components/schemas/DateTime'
        last_sent_at:
          $ref: '#/components/schemas/DateTime'
        replied_at:
          $ref: '#/components/schemas/DateTime'
        stopped_at:
          $ref: '#/components/schemas/DateTime'
        paused_at:
          $ref: '#/components/schemas/DateTime'
        removed_at:
          $ref: '#/components/schemas/DateTime'

    EnrollmentExport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentExportRecord'
        meta:
          $ref: '#/components/schemas/ExportMeta'

    SuppressionExportRecord:
      type: object
      properties:
        email:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/DateTime'

    SuppressionExport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuppressionExportRecord'
        meta:
          $ref: '#/components/schemas/ExportMeta'

    CampaignOutcomeExportRecord:
      type: object
      properties:
        campaign:
          type: [string, 'null']
        status:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/DateTime'
        launched_at:
          $ref: '#/components/schemas/DateTime'
        completed_at:
          $ref: '#/components/schemas/DateTime'
        queued:
          type: integer
        sent:
          type: integer
        replied:
          type: integer
        interested:
          type: integer
        bounced:
          type: integer
        unsubscribed:
          type: integer
        needs_review:
          type: integer

    CampaignOutcomeExport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignOutcomeExportRecord'
        meta:
          $ref: '#/components/schemas/ExportMeta'

    ExportMeta:
      type: object
      required: [limit, truncated, full_export_format]
      properties:
        limit:
          type: integer
          example: 1000
        truncated:
          type: boolean
        full_export_format:
          type: string
          const: csv
