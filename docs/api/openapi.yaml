      required: [person_ids]
      additionalProperties: false
      properties:
        person_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
          description: Distinct workspace person ids.

    UpdateCampaignRecipientRequest:
      type: object
      additionalProperties: false
      description: Provide exactly one of `action` or `mailbox_id`.
      properties:
        action:
          type: [string, 'null']
          enum: [pause, resume]
        mailbox_id:
          type: [integer, 'null']

    StorePersonRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 255
        full_name:
          type: [string, 'null']
          maxLength: 255
        job_title:
          type: [string, 'null']
          maxLength: 255
        notes:
          type: [string, 'null']
          maxLength: 10000
        tags:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            maxLength: 40
        account_id:
          type: [integer, 'null']

    StoreAccountRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        website:
          type: [string, 'null']
          maxLength: 255
        notes:
          type: [string, 'null']
          maxLength: 10000
        tags:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            maxLength: 40
        confirmed_duplicate:
