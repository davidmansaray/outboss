  /threads:
    get:
      operationId: listThreads
      tags: [Threads]
      summary: List inbox threads
      description: |
        Lists Unibox threads. Default folder is `all_open`. `mailbox` is a mailbox id.
        `campaign` is a campaign id, `all`, or `none`.
      x-required-scope: inbox:read
      parameters:
        - name: folder
          in: query
          description: Unibox folder. Unknown values fall back to `all_open`.
          schema:
            $ref: '#/components/schemas/InboxFolder'
        - name: mailbox
          in: query
          description: When set to a positive integer, only threads from that mailbox are returned.
          schema:
            type: integer
        - name: campaign
          in: query
          description: Campaign id, `all` (default), or `none` (threads with no campaign recipient).
          schema:
            type: string
        - name: q
          in: query
          description: Search subject, preview, and the other person's name or email (2–100 characters; shorter is ignored).
          schema:
            type: string
            maxLength: 100
        - name: unread
          in: query
          description: When true, only unread threads.
          schema:
            type: boolean
        - name: pagination
          in: query
          description: |
            `page` (default) uses page numbers. `cursor` uses keyset paging on
            `(last_message_at desc, id desc)`, which stays correct while new replies arrive.
          schema:
            type: string
            enum: [page, cursor]
        - name: cursor
          in: query
          description: '`meta.next_cursor` from the previous cursor page.'
          schema:
            type: string
        - $ref: '#/components/parameters/PerPageDefault50'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Thread summaries, page-numbered or cursor-paged
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ThreadSummaryPage'
                  - $ref: '#/components/schemas/ThreadSummaryCursorPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

