  /exports/enrollments:
    get:
      operationId: exportEnrollments
      tags: [Exports]
      summary: Export enrolments
      description: |
        One row per campaign recipient snapshot. JSON by default; CSV when `format=csv`
        or `Accept` contains `text/csv`. See [docs/export-formats.md](../export-formats.md).
      x-required-scope: exports:read
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: Enrolment export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentExport'
            text/csv:
              schema:
                type: string
              example: campaign,campaign_status,email,full_name
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /exports/suppressions:
    get:
      operationId: exportSuppressions
      tags: [Exports]
      summary: Export suppressions
      description: |
        Suppression list export. JSON by default; CSV when `format=csv` or `Accept` contains `text/csv`.
      x-required-scope: exports:read
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: Suppression export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionExport'
            text/csv:
              schema:
                type: string
              example: email,reason,created_at
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /exports/campaign-outcomes:
    get:
      operationId: exportCampaignOutcomes
      tags: [Exports]
      summary: Export campaign outcomes
      description: |
        Per-campaign outcome counts. JSON by default; CSV when `format=csv` or `Accept` contains `text/csv`.
      x-required-scope: exports:read
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: Campaign outcome export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutcomeExport'
            text/csv:
              schema:
                type: string
              example: campaign,status,created_at,launched_at,completed_at,queued,sent,replied,interested,bounced,unsubscribed,needs_review
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: |
        Personal access token from Setup & safety → API keys. Send as
        `Authorization: Bearer {token}`. The token's scopes gate every route.

  parameters:
    CampaignId:
      name: campaign
      in: path
      required: true
      schema:
        type: integer
      description: Campaign id
    StepId:
      name: step
      in: path
      required: true
      schema:
        type: integer
      description: Sequence step id
    RecipientId:
      name: recipient
      in: path
      required: true
      schema:
        type: integer
      description: Campaign recipient id
    PersonId:
      name: person
      in: path
      required: true
      schema:
        type: integer
      description: Person id
    AccountId:
      name: account
      in: path
      required: true
      schema:
        type: integer
      description: Account id
    ThreadId:
      name: thread
      in: path
      required: true
      schema:
        type: integer
      description: Thread id
    MailboxId:
      name: mailbox
      in: path
      required: true
      schema:
        type: integer
      description: Mailbox id
    SuppressionId:
      name: entry
      in: path
      required: true
      schema:
        type: integer
      description: Suppression entry id
    Page:
      name: page
      in: query
      description: Page number (Laravel paginator, default 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageDefault15:
      name: per_page
      in: query
      description: Results per page. Clamped to 1–100. Default 15.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    PerPageDefault25:
      name: per_page
      in: query
      description: Results per page. Clamped to 1–100. Default 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PerPageDefault50:
      name: per_page
      in: query
      description: Results per page. Clamped to 1–100. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StatusCampaign:
      name: status
      in: query
      description: Filter by campaign status. Unknown values are ignored.
      schema:
        $ref: '#/components/schemas/CampaignStatus'
    StatusRecipient:
      name: status
      in: query
      description: Filter by recipient lifecycle status. Unknown values are ignored.
      schema:
        $ref: '#/components/schemas/RecipientStatus'
    SearchQuery:
      name: query
      in: query
      description: Search term.
      schema:
        type: string
    SearchQ:
      name: q
      in: query
      description: Alias for `query`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional replay key (maximum 255 characters). When present on a supported route,
        a successful or 4xx response is stored for 24 hours and replayed for the same
        token, route, and key. Missing or blank keys are ignored. Keys longer than 255
        characters return a validation error.
      schema:
        type: string
        maxLength: 255
    ExportFormat:
      name: format
      in: query
      description: "Set to `csv` to stream a CSV instead of JSON. `Accept: text/csv` has the same effect."
      schema:
        type: string
        enum: [csv]

  responses:
    DeviceSessionRequired:
      description: '`device_session_required`: only signed-in iOS devices can call this'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: |
        Missing or invalid bearer token (`unauthenticated`), or an expired device access
        token (`token_expired`): refresh it and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: unauthenticated
              message: Authentication required.
    Forbidden:
      description: Missing scope or unauthorised for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficient_scope:
              value:
                error:
                  type: insufficient_scope
                  message: This API key does not have the campaigns:read scope.
            forbidden:
              value:
                error:
                  type: forbidden
                  message: This action is unauthorised.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: not_found
              message: The requested resource was not found.
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: validation_error
              message: The name field is required.
              errors:
                name:
                  - The name field is required.
    RateLimited:
      description: More than 120 requests per minute for this token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: rate_limited
              message: Too many requests.

  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      description: Standard API error body used for `/api/*` exceptions and scope denials.
      properties:
        error:
          type: object
          required: [type, message]
          additionalProperties: true
          properties:
            type:
              type: string
              description: Machine-readable error type
              enum:
                - validation_error
                - unauthenticated
                - forbidden
                - insufficient_scope
                - not_found
                - rate_limited
                - bad_request
                - http_error
            message:
              type: string
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Present on `validation_error` — Laravel field messages.

    PaginationLinks:
      type: object
      additionalProperties: true
      properties:
        first:
          type: [string, 'null']
          format: uri
        last:
          type: [string, 'null']
          format: uri
        prev:
          type: [string, 'null']
          format: uri
        next:
          type: [string, 'null']
          format: uri

    PaginationMeta:
      type: object
      additionalProperties: true
      description: |
        Laravel paginator meta. Resource collections also include `from`, `to`, `path`, and `links`.
        Some custom list endpoints return only `current_page`, `last_page`, `per_page`, and `total`.
      required: [current_page, last_page, per_page, total]
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: [integer, 'null']
        to:
          type: [integer, 'null']
        path:
          type: string
        links:
          type: array
          items:
            type: object
            additionalProperties: true

    CampaignStatus:
      type: string
      enum: [draft, active, paused, completed]

    SendMode:
      type: string
      enum: [rotate, pin]

    SequenceSendAs:
      type: string
      enum: [new_thread, reply]

    RecipientStatus:
      type: string
      enum:
        - queued
        - active
        - paused
        - blocked_mailbox
        - completed
        - replied
        - interested
        - not_now
        - wrong_person
        - bounced
        - unsubscribed
        - removed

    RecipientDisplayStatus:
      type: string
      description: Display status — lifecycle value, or `opened` / `in_sequence` for in-flight recipients.
      enum:
        - queued
        - active
        - paused
        - blocked_mailbox
        - completed
        - replied
        - interested
        - not_now
        - wrong_person
        - bounced
        - unsubscribed
        - removed
        - opened
        - in_sequence

    SuppressionReason:
      type: string
      enum: [unsubscribe, hard_bounce, manual]

    ConnectionStatus:
      type: string
      enum: [connected, needs_reconnect, disconnected]

    MailProvider:
      type: string
      enum: [gmail, microsoft, zoho]

    ThreadClassification:
      type: string
      enum: [human, out_of_office, bounce, unsubscribe, system, unknown]

    ThreadLocalState:
      type: string
      enum: [needs_action, open, out_of_office, problem, done]

    InboxFolder:
      type: string
      enum:
        - leads
        - all_replies
        - closed
        - needs
        - all_open
        - open
        - ooo
        - delivery
        - opt_outs
        - problems
        - done
        - sent

    MessageDirection:
      type: string
      enum: [inbound, outbound]

    DomainAuthResult:
      type: string
      enum: [pass, missing, unknown]

    PersonSource:
      type: string
      enum: [manual, import, campaign_backfill]

    DateTime:
      type: [string, 'null']
      format: date-time
      description: ISO 8601 timestamp, or null

    NamedId:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    CreateCampaignRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120

    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        send_mode:
          $ref: '#/components/schemas/SendMode'
        mailbox_ids:
          type: array
          items:
            type: integer
          description: Workspace mailbox ids in send order. Unknown ids are ignored.
        open_tracking_enabled:
          type: boolean

    CreateSequenceStepRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          maxLength: 80
          description: Defaults to Follow-up when omitted.

    UpdateSequenceStepRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 80
        delay_minutes:
          type: integer
          enum: [0, 2880, 4320, 7200, 10080]
        send_as:
          $ref: '#/components/schemas/SequenceSendAs'
        subject_template:
          type: [string, 'null']
          maxLength: 240
        body_template:
          type: string
          maxLength: 10000

    ReorderSequenceStepsRequest:
      type: object
      required: [step_ids]
      additionalProperties: false
      properties:
        step_ids:
          type: array
          minItems: 1
          items:
            type: integer
          description: Distinct active step ids in the new order.

    TestSequenceStepRequest:
      type: object
      required: [mailbox_id, to, client_operation_id]
      additionalProperties: false
      properties:
        mailbox_id:
          type: integer
        to:
          type: string
          format: email
        client_operation_id:
          type: string
          format: uuid

    EnrollPeopleRequest:
