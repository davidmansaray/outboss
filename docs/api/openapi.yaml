      additionalProperties: false
      properties:
        body:
          type: string
        client_operation_id:
          type: string
          format: uuid

    ClassifyThreadRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - interested
            - replied
            - treat_as_reply
            - not_now
            - wrong_person
            - remove_bad_address
            - remove_from_campaign

    ComposeMessageRequest:
      type: object
      required: [mailbox_id, to, subject, body, client_operation_id]
      additionalProperties: false
      properties:
        mailbox_id:
          type: integer
        to:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
        client_operation_id:
          type: string
          format: uuid

    UpdateMailboxSendingRequest:
      type: object
      additionalProperties: false
      properties:
        daily_send_cap:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000

    StoreSuppressionRequest:
