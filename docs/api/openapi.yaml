openapi: 3.1.0
info:
  title: Outboss API
  version: '1.0.0'
  summary: Workspace-scoped REST API for campaigns, people, inbox, mailboxes, suppressions, and exports.
  description: |
    REST API v1 for Outboss. Authenticate with a personal access token created in
    **Setup & safety → API keys**. Every request is scoped to the token owner's current workspace.

    Per-operation scope requirements are listed in each operation description and in the
    `x-required-scope` extension. Launch (`campaigns:launch`) and inbox send (`inbox:send`)
    are separate from write scopes so a key can draft campaigns without sending email.

    The machine-readable companion to [docs/api.md](../api.md).
  license:
    name: MIT
  contact:
    name: Outboss

servers:
  - url: https://{host}/api/v1
    description: Self-hosted Outboss instance
    variables:
      host:
        default: your-host.example
        description: Hostname of your Outboss install (no scheme or path)

tags:
  - name: Campaigns
    description: Campaigns, launch readiness, pause, resume, complete, and launch.
  - name: Sequence steps
    description: Draft sequence steps, preview, reorder, and test sends.
  - name: Enrolments
    description: Enrolable people and campaign recipients.
  - name: People
    description: Durable people registry.
  - name: Accounts
    description: Durable accounts (companies).
  - name: Sign-in & devices
    description: |
      Server discovery, sign-in for the Outboss iOS app (PKCE code exchange and rotating
      refresh tokens), the current user, and push notification registration. `/server` is
      public. Personal API keys can call `/me`; device-only endpoints return
      `device_session_required` for them.
  - name: Threads
    description: Unified inbox threads, replies, triage, and compose.
  - name: Mailboxes
    description: Connected mailboxes, domain auth, sync, and sending controls.
  - name: Suppressions
    description: Workspace suppression list.
  - name: Exports
    description: JSON or CSV workspace exports.

security:
  - bearerAuth: []

paths:
  /server:
    get:
      operationId: getServer
      tags: [Sign-in & devices]
      summary: Identify this Outboss server
      description: |
        Public; no token. The iOS app calls it to confirm that a self-hosted address is an
        Outboss server before sign-in. `sign_in_url` is the absolute URL of the web sign-in
        page (`GET /mobile/authorize`). `push` uses the same readiness check as
        `/me` `capabilities.push`. `version` is the server's release label, or `dev` when
        none is configured. Rate limited to 120 requests per minute per client address.
      security: []
      responses:
        '200':
          description: Server description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerEnvelope'
              example:
                data:
                  product: outboss
                  version: dev
                  api: v1
                  push: false
                  sign_in_url: https://your-host.example/mobile/authorize
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/token:
    post:
      operationId: issueDeviceToken
      tags: [Sign-in & devices]
      summary: Exchange a sign-in code or refresh token for device tokens
      description: |
        Used by the iOS app. `authorization_code` trades the one-time code from the web
        sign-in sheet (`GET /mobile/authorize`, outside this API) plus the PKCE verifier for a
        one-hour access token and a single-use refresh token. `refresh_token` rotates the
        refresh token and mints a new access token; pass `workspace_id` to switch workspace.

        A refresh token reused within 30 seconds of its first use (a lost response) mints a
        fresh pair. Later reuse revokes the device session and returns `session_revoked`.
        Access tokens carry exactly `inbox:read`, `inbox:send`, `mailboxes:read`,
        `campaigns:read` and `people:read`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
      responses:
        '200':
          description: New device tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokensEnvelope'
        '400':
          description: '`invalid_grant`: the code or refresh token is invalid, used or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: '`session_revoked`: the device was signed out or a refresh token was reused'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: '`workspace_forbidden`: not a member of `workspace_id`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      operationId: signOutDevice
      tags: [Sign-in & devices]
      summary: Sign this device out
      description: Revokes the device session, its access and refresh tokens, and its push registration.
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceSessionRequired'

  /me:
    get:
      operationId: getMe
      tags: [Sign-in & devices]
      summary: Current user, workspace and session
      description: |
        Who the token belongs to, the workspace it is bound to, every workspace the person can
        switch to, and whether push notifications are available on this server. Any token.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /devices/current/push:
    put:
      operationId: registerDevicePush
      tags: [Sign-in & devices]
      summary: Register this device for push notifications
      description: |
        Stores the APNs device token and notification preference. Send it on every launch;
        Apple can rotate tokens. A token registered by another session is moved to this one.
        `needs` alerts for replies that land in Needs reply, `leads` only for interested
        recipients, `off` keeps the badge without alerts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDevicePushRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePushEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceSessionRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: removeDevicePush
      tags: [Sign-in & devices]
      summary: Stop push notifications for this device
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceSessionRequired'

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [Campaigns]
      summary: List campaigns
      description: |
        Returns a paginated list of campaigns in the current workspace, newest `updated_at` first.
        Optional `status` is ignored when it is not a known campaign status.
      x-required-scope: campaigns:read
      parameters:
        - $ref: '#/components/parameters/StatusCampaign'
        - $ref: '#/components/parameters/PerPageDefault15'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated campaign summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createCampaign
      tags: [Campaigns]
      summary: Create a campaign
      description: |
        Creates a draft campaign with a default Intro sequence step. Does not send email.
        The campaign stays in draft until launch.
      x-required-scope: campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      operationId: getCampaign
      tags: [Campaigns]
      summary: Get a campaign
      description: Returns one campaign including sequence steps and attached mailbox ids.
      x-required-scope: campaigns:read
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateCampaign
      tags: [Campaigns]
      summary: Update a campaign
      description: |
        Updates name, send mode, mailbox ids, and/or open tracking.
        Sending setup (`send_mode`, `mailbox_ids`, `open_tracking_enabled`) can only change
        while the campaign is draft or paused.
      x-required-scope: campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/launch-readiness:
    get:
      operationId: getCampaignLaunchReadiness
      tags: [Campaigns]
      summary: Check launch readiness
      description: |
        Reports whether a campaign is ready to launch. `ready` is true when `blockers` is empty.
        Always check this before launch.
      x-required-scope: campaigns:read
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Readiness report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchReadiness'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/launch:
    post:
      operationId: launchCampaign
      tags: [Campaigns]
      summary: Launch a campaign
      description: |
        Publishes the sequence and starts sending to enrolled recipients. Requires `campaigns:launch`,
        not `campaigns:write`. Fails when launch blockers remain. Supports `Idempotency-Key`.
      x-required-scope: campaigns:launch
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Launched campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/pause:
    post:
      operationId: pauseCampaign
      tags: [Campaigns]
      summary: Pause a campaign
      description: Pauses an active campaign. Recipients stop receiving further sequence mail until resume.
      x-required-scope: campaigns:write
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Paused campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/resume:
    post:
      operationId: resumeCampaign
      tags: [Campaigns]
      summary: Resume a campaign
      description: |
        Resumes a paused or completed campaign and continues sending to remaining recipients.
        Requires `campaigns:launch`. The campaign must still pass launch readiness.
      x-required-scope: campaigns:launch
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Resumed campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/complete:
    post:
      operationId: completeCampaign
      tags: [Campaigns]
      summary: Complete a campaign
      description: Marks a campaign as completed and stops remaining sequence work. Draft campaigns cannot be completed.
      x-required-scope: campaigns:write
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Completed campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/enrollable-people:
    get:
      operationId: listEnrollablePeople
      tags: [Enrolments]
      summary: List people for enrolment
      description: |
        Lists workspace people with enrolment eligibility for this campaign.
        Use `only_eligible=1` to hide already enrolled and suppressed addresses.
      x-required-scope: campaigns:read
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/SearchQuery'
        - name: only_eligible
          in: query
          description: When true, exclude already enrolled and suppressed people.
          schema:
            type: boolean
        - $ref: '#/components/parameters/PerPageDefault25'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated enrolable people
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollablePersonPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/enrollments:
    post:
      operationId: enrollPeople
      tags: [Enrolments]
      summary: Enrol people in a campaign
      description: |
        Enrols people by id (maximum 500). Skips unknown, already enrolled, or suppressed addresses.
        Does not send email. Supports `Idempotency-Key`. When the campaign is completed and at least
        one person is enrolled, the response includes a `notice` to resume sending.
      x-required-scope: campaigns:write
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollPeopleRequest'
      responses:
        '201':
          description: Enrolment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/recipients:
    get:
      operationId: listCampaignRecipients
      tags: [Enrolments]
      summary: List campaign recipients
      description: Paginated recipients for a campaign. Optional `status` is ignored when it is not a known recipient lifecycle value.
      x-required-scope: campaigns:read
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/StatusRecipient'
        - $ref: '#/components/parameters/PerPageDefault15'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated recipients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignRecipientPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/steps:
    post:
      operationId: addSequenceStep
      tags: [Sequence steps]
      summary: Add a sequence step
      description: Adds a follow-up step to the campaign draft sequence. The campaign must be draft or paused.
      x-required-scope: campaigns:write
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSequenceStepRequest'
      responses:
        '201':
          description: Created step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceStepEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaigns/{campaign}/steps/order:
    put:
      operationId: reorderSequenceSteps
      tags: [Sequence steps]
      summary: Reorder sequence steps
      description: Reorders the campaign draft sequence. Provide every active step id exactly once.
      x-required-scope: campaigns:write
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSequenceStepsRequest'
      responses:
        '200':
          description: Reordered steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceStepCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sequence-steps/{step}:
    parameters:
      - $ref: '#/components/parameters/StepId'
    patch:
      operationId: updateSequenceStep
      tags: [Sequence steps]
      summary: Update a sequence step
      description: |
        Updates title, delay, send_as, subject, or body. Allowed `delay_minutes`: 0, 2880, 4320, 7200, 10080.
        Templates may use `{{first_name}}` and `{{company}}`. The campaign must be editable.
      x-required-scope: campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSequenceStepRequest'
      responses:
        '200':
          description: Updated step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceStepEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteSequenceStep
      tags: [Sequence steps]
      summary: Delete a sequence step
      description: Soft-deletes a draft sequence step. The campaign must be editable.
      x-required-scope: campaigns:write
      responses:
        '204':
          description: Step deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sequence-steps/{step}/preview:
    get:
      operationId: previewSequenceStep
      tags: [Sequence steps]
      summary: Preview a rendered step
      description: |
        Renders the step subject and body. Pass `recipient_id` to use an enrolled recipient;
        otherwise a sample Jane / Acme recipient is used.
      x-required-scope: campaigns:read
      parameters:
        - $ref: '#/components/parameters/StepId'
        - name: recipient_id
          in: query
          description: Campaign recipient id belonging to this step's campaign.
          schema:
            type: integer
      responses:
        '200':
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceStepPreview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sequence-steps/{step}/test:
    post:
      operationId: testSequenceStep
      tags: [Sequence steps]
      summary: Send a test email for a step
      description: |
        Sends a rendered sequence step to a test address from the chosen mailbox.
        Requires `inbox:send`. `client_operation_id` is a UUID used for send-level idempotency.
        Supports `Idempotency-Key`.
      x-required-scope: inbox:send
      parameters:
        - $ref: '#/components/parameters/StepId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSequenceStepRequest'
      responses:
        '200':
          description: Test sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentFlag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /campaign-recipients/{recipient}:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    patch:
      operationId: updateCampaignRecipient
      tags: [Enrolments]
      summary: Pause, resume, or pin a recipient
      description: |
        Provide exactly one of `action` (`pause` or `resume`) or `mailbox_id`.
        Mailbox cannot change after the first send.
      x-required-scope: campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRecipientRequest'
      responses:
        '200':
          description: Updated recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignRecipientEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: removeCampaignRecipient
      tags: [Enrolments]
      summary: Remove a recipient
      description: Removes a recipient from the campaign.
      x-required-scope: campaigns:write
      responses:
        '204':
          description: Recipient removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
